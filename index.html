function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}function go(p){state.page=p;save();render()}function render(){nav();let titles={dashboard:['总控台','先看今天，再看整本书。'],novel:['小说信息','所有基础资料都可以自由编辑。'],manuscript:['正文库','正文是核心数据来源：先写，再让系统帮你整理。'],serial:['连载中心','更新、日历与存稿统一放在这里。'],todo:['阶段 Todo','阶段完全自定义，字数只是参考。'],cards:['牌库','自由新建、编辑、复制、删除；预设只是起点。'],map:['信息地图','管理信息层级、认知与揭底过程。'],characters:['人物','人物档案、认知、误解与自定义字段。'],relations:['人物关系','把双方怎么看彼此、信息差和实际关系放在一起。'],timeline:['时间轴','把章节、牌、信息、人物与关系变化串成一条线。'],chapter:['章节卡','少填，多选；尽量从已有数据库调用。'],review:['章节复盘','正文先扫描，再确认变化。'],systems:['自定义体系','统一管理类型、层级与状态。'],data:['数据管理','JSON 全量备份；数据始终属于你。']};let [t,d]=titles[state.page]||titles.dashboard;document.getElementById('main').innerHTML=`<div class="top"><div><h1>${t}</h1><div class="muted">${d}</div></div><div class="actions"><button onclick="go('manuscript')">导入正文</button><button onclick="openModal('chapter')">＋新建章节</button><button onclick="exportJSON()">导出</button></div></div>${pages[state.page]() }<footer>V2 本地版：无 AI、无服务器也能完整运行。识别基于本地规则与已有数据库；AI 可作为未来的额外分析层。</footer>`}

function dashboard(){let st=state.stages[state.progress.stageIndex||0]||state.stages[0],done=st.done.length,total=st.tasks.length;return `<div class="grid"><div class="card metric"><small>当前阶段</small><b>${esc(st.name.split('｜')[0])}</b><span>${esc(st.name.split('｜')[1]||'')}</span></div><div class="card metric"><small>正文总字数</small><b>${state.progress.totalWords.toLocaleString()}</b><span>目标进度 ${state.progress.percent||0}%</span></div><div class="card metric"><small>今日写作</small><b>${state.progress.todayWords.toLocaleString()}</b><span>目标 ${state.serial.settings.targetWords.toLocaleString()} 字 / ${state.serial.settings.targetChapters} 章</span></div><div class="card metric"><small>存稿</small><b>${state.progress.stock} 章</b><span>${stockWords().toLocaleString()} 字</span></div></div><div class="section two"><div class="card"><h2>小说信息</h2><p><b>${esc(state.novel.name)}</b></p><p class="muted">${esc(state.novel.intro||'还没有简介。')}</p><div class="chips">${arr(state.novel.tags).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="go('novel')">编辑小说信息</button></div></div><div class="card"><h2>阶段进度</h2><p>${esc(st.goal)}</p><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><p class="muted">${done}/${total} 完成</p><button onclick="go('todo')">管理阶段</button></div></div><div class="section two"><div class="card"><h2>系统状态</h2><p>信息层级：<span class="badge">${esc(state.progress.infoLevel)}</span></p><p>感情阶段：<span class="badge">${esc(state.progress.loveStage)}</span></p><p>连载状态：<span class="badge">${esc(state.progress.serialStatus)}</span></p><button onclick="openModal('progress')">编辑状态</button></div><div class="card"><h2>资源状态</h2>${state.cards.slice(0,4).map(c=>`<div class="item"><b>${esc(c.name)}</b><span class="badge">${esc(resourceStatus(c))}</span></div>`).join('')}<button onclick="go('cards')">查看牌库</button></div></div>`}
function novel(){return `<div class="card"><div class="formgrid">${field('小说名称','nov_name',state.novel.name)}${field('作者','nov_author',state.novel.author)}${field('当前书名','nov_current',state.novel.currentTitle)}${field('备用书名','nov_alt',state.novel.altTitles)}${field('曾用名','nov_old',state.novel.oldTitles)}</div>${field('简介','nov_intro',state.novel.intro,true)}${field('标签（逗号分隔）','nov_tags',state.novel.tags)}<div class="actions"><button class="primary" onclick="saveNovel()">保存</button></div></div>`}
function field(label,id,value='',ta=false){return `<div class="field"><label>${label}</label>${ta?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`}
function saveNovel(){Object.assign(state.novel,{name:g('nov_name'),author:g('nov_author'),currentTitle:g('nov_current'),altTitles:g('nov_alt'),oldTitles:g('nov_old'),intro:g('nov_intro'),tags:g('nov_tags')});save();toast('小说信息已保存');render()}
function manuscript(){return `<div class="card"><div class="toolbar"><button class="primary" onclick="openModal('chapterImport')">＋粘贴正文并分章</button><label><button onclick="document.getElementById('txtInput').click()">导入 TXT</button><input id="txtInput" type="file" accept=".txt,text/plain" style="display:none" onchange="importTxt(event)"></label><button onclick="document.getElementById('multiInput').click()">批量导入章节</button><input id="multiInput" type="file" accept=".txt,text/plain" multiple style="display:none" onchange="importMulti(event)"><input id="msSearch" placeholder="搜索章节" oninput="renderManuscriptList()"></div><div class="hint">如果一次粘贴整本正文，系统会按“第X章”这类章节标题自动拆开；拆开后每章都可以单独查看、编辑和删除。</div><div id="msList">${manuscriptList()}</div></div>`}
function manuscriptList(){if(!state.chapters.length)return '<div class="empty">还没有正文。可以一次粘贴全文，系统会自动按章节标题分开。</div>';let q=(document.getElementById('msSearch')?.value||'').toLowerCase();let rows=state.chapters.filter(c=>(c.num+' '+c.title+' '+c.text).toLowerCase().includes(q));return `<div class="chapter-buttons">${rows.map((c,i)=>{let real=state.chapters.indexOf(c);return `<button class="chapter-mini" onclick="openModal('viewChapter',${real})"><b>第${esc(c.num||'?')}章</b><span>${esc(c.title||'未命名')}</span><small>${(c.text||'').length.toLocaleString()}字 · ${esc(c.status||'已完成')}</small></button>`}).join('')}</div>`}
function renderManuscriptList(){let box=document.getElementById('msList');if(box)box.innerHTML=manuscriptList()}
function importTxt(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{openModal('chapterImport',null,r.result,f.name.replace(/\.txt$/i,''))};r.readAsText(f)}function importMulti(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{let parts=splitChapters(r.result,f.name.replace(/\.txt$/i,''));state.chapters.push(...parts);recalc();save();render()};r.readAsText(f)});toast('正在导入章节')}
function splitChapters(text,fallbackTitle='未命名'){let t=String(text||'').replace(/\r\n?/g,'\n').trim();let re=/(?:^|\n)\s*(第[0-9一二三四五六七八九十百千万零两]+章(?:[^\n]*)?)/g,m,ms=[];while((m=re.exec(t)))ms.push({index:m.index,heading:m[1].trim(),start:re.lastIndex});if(!ms.length)return [{id:uid('CH'),num:'1',title:fallbackTitle,text:t,status:'已完成',analysis:null,review:null,card:{functions:[],engine:'',resources:[],changes:''},checklist:{}}];let out=[];for(let i=0;i<ms.length;i++){let h=ms[i].heading;let nm=(h.match(/^第([0-9一二三四五六七八九十百千万零两]+)章/)||[])[1]||String(i+1);let title=h.replace(/^第[0-9一二三四五六七八九十百千万零两]+章\s*/,'').trim()||'未命名';let body=t.slice(ms[i].start,i+1<ms.length?ms[i+1].index:t.length).trim();out.push({id:uid('CH'),num:nm,title,text:body,status:'已完成',analysis:null,review:null,card:{functions:[],engine:'',resources:[],changes:''},checklist:{}})}return out}

function serial(){let s=state.serial.settings;return `<div class="grid"><div class="card metric"><small>今日目标</small><b>${s.targetChapters} 章</b><span>${s.targetWords.toLocaleString()} 字</span></div><div class="card metric"><small>今日完成</small><b>${todayChapter()?1:0} 章</b><span>${state.progress.todayWords.toLocaleString()} 字</span></div><div class="card metric"><small>存稿</small><b>${state.progress.stock} 章</b><span>${stockWords().toLocaleString()} 字</span></div><div class="card metric"><small>累计更新</small><b>${state.serial.published.length} 章</b><span>${state.serial.published.reduce((n,x)=>n+(+x.words||0),0).toLocaleString()} 字</span></div></div><div class="section two"><div class="card"><h2>今日更新</h2><div class="formgrid">${field('今日章节','ser_ch',todayChapter())}${field('今日字数','ser_words',state.progress.todayWords)}${field('今日更新章数','ser_count',todayChapter()?1:0)}</div><div class="actions"><button class="primary" onclick="saveToday()">记录今日更新</button></div></div><div class="card"><h2>连载目标</h2><div class="formgrid"><div class="field"><label>更新频率</label><select id="ser_freq">${opts(['每日','隔日','每周3次','自定义'],s.freq)}</select></div>${field('目标章节数（每个更新周期）','ser_targetChapters',s.targetChapters)}${field('目标字数（每个更新周期）','ser_targetWords',s.targetWords)}${field('发布时间','ser_time',s.time)}${field('安全存稿线（章节）','ser_safety',s.safety)}</div><button class="primary" onclick="saveSerialSettings()">保存目标</button></div></div><div class="section card"><h2>存稿池</h2><p><b>${state.progress.stock} 章 · ${stockWords().toLocaleString()} 字</b></p><div class="progress"><i style="width:${Math.min(100,state.progress.stock/Math.max(1,s.safety)*100)}%"></i></div><p class="muted">安全线：${s.safety} 章</p></div><div class="section card"><h2>已更新</h2>${publishedList()}</div><div class="section card"><h2>连载日历</h2>${calendar()}</div>`}
function todayChapter(){let d=new Date().toISOString().slice(0,10);let x=state.serial.days.find(x=>x.date===d);return x?.chapter||''}function saveToday(){let d=new Date().toISOString().slice(0,10),x=state.serial.days.find(x=>x.date===d);let o={date:d,chapter:g('ser_ch'),words:+g('ser_words')||0,time:'',note:'',count:+g('ser_count')||0};if(x)Object.assign(x,o);else state.serial.days.push(o);state.progress.todayWords=o.words;state.serial.published=state.serial.published||[];if(o.chapter&&!state.serial.published.some(p=>p.date===d)){state.serial.published.push({date:d,chapter:o.chapter,words:o.words})}recalc();save();toast('今日更新已记录');render()}function saveSerialSettings(){Object.assign(state.serial.settings,{freq:g('ser_freq'),targetChapters:+g('ser_targetChapters')||1,targetWords:+g('ser_targetWords')||2000,time:g('ser_time'),safety:+g('ser_safety')||5});save();render()}function calendar(){return state.serial.days.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>`<div class="item"><b>${x.date}</b>　${esc(x.chapter||'未更新')}　${x.words||0}字</div>`).join('')||'<div class="empty">还没有更新记录。</div>'}function publishedList(){let p=state.serial.published||[];return p.length?p.slice().reverse().slice(0,20).map(x=>`<div class="item"><b>${esc(x.chapter||'未命名')}</b><span class="muted">　${x.words||0}字 · ${x.date}</span></div>`).join(''):'<div class="empty">还没有更新记录。</div>'}function stockDays(){return 0}function stockWords(){return state.chapters.filter(c=>c.status==='已完成'&&!c.published).reduce((n,c)=>n+(c.text||'').length,0)}

function todo(){return `<div class="toolbar"><button class="primary" onclick="openModal('stage')">＋新建阶段</button></div>${state.stages.map((s,i)=>`<div class="card section"><div class="item-head"><div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.goal)}</p></div><div class="actions small"><button onclick="openModal('stage',${i})">编辑</button><button onclick="copyStage(${i})">复制</button><button class="danger" onclick="delObj('stages',${i})">删除</button></div></div><div class="progress"><i style="width:${s.tasks.length?s.done.length/s.tasks.length*100:0}%"></i></div><div>${s.tasks.map((x,j)=>`<label class="todo" style="display:flex;gap:8px;padding:8px 0"><input type="checkbox" ${s.done.includes(j)?'checked':''} onchange="toggleStage(${i},${j},this.checked)"><span class="${s.done.includes(j)?'muted':''}">${esc(x)}</span></label>`).join('')}</div></div>`).join('')}`}
function toggleStage(i,j,v){let d=state.stages[i].done;v&&!d.includes(j)?d.push(j):!v&&(state.stages[i].done=d.filter(x=>x!==j));state.progress.stageIndex=i;save();render()}
function copyStage(i){let s=structuredClone(state.stages[i]);s.name+='（副本）';s.done=[];state.stages.splice(i+1,0,s);save();render()}
function cards(){return `<div class="toolbar"><button class="primary" onclick="openModal('card')">＋新建牌</button><input id="cardQ" placeholder="搜索牌" oninput="filterRender('cardQ','cardGrid')"><select id="cardType" onchange="filterRender('cardQ','cardGrid')"><option value="">全部类型</option>${opts(state.systems.types.card)}</select></div><div class="cardlist" id="cardGrid">${state.cards.map((c,i)=>cardView(c,i)).join('')}</div>`}function cardView(c,i){return `<div class="card resource" data-search="${esc((c.name+' '+c.content+' '+c.tags).toLowerCase())}" data-type="${esc(c.type)}"><div class="item-head"><div><span class="badge">${esc(c.type)}</span><span class="badge">深度 ${esc(c.depth)}</span></div><div class="actions small"><button onclick="openModal('card',${i})">编辑</button><button onclick="copyCard(${i})">复制</button><button class="danger" onclick="delObj('cards',${i})">删除</button></div></div><h3>${esc(c.name)}</h3><p>${esc(c.content)}</p><p class="muted">${esc(c.note)}</p><div class="chips">${arr(c.tags).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><p class="muted">使用 ${c.uses||0} 次 · ${resourceStatus(c)}</p></div>`}function filterRender(qid,gridid){let q=(document.getElementById(qid)?.value||'').toLowerCase(),t=document.getElementById('cardType')?.value||'';document.querySelectorAll('#'+gridid+' .resource').forEach(x=>x.style.display=(!q||x.dataset.search.includes(q))&&(!t||x.dataset.type===t)?'':'none')}
function copyCard(i){let c=structuredClone(state.cards[i]);c.id=uid('R');c.name+='（副本）';c.uses=0;state.cards.splice(i+1,0,c);save();render()}
function map(){let groups=state.info.reduce((m,x)=>{(m[x.type]||(m[x.type]=[])).push(x);return m},{});return `<div class="hint">信息地图不是让你把设定全部写满。它只记录“读者现在知道什么、谁知道什么、还差哪一步”。这里已经放了几条与你这本书直接相关的起始信息，后面继续加即可。</div><div class="toolbar"><button class="primary" onclick="openModal('info')">＋新建信息点</button></div>${state.info.length?Object.entries(groups).map(([type,items])=>`<div class="section"><h2>${esc(type)}</h2><div class="three">${items.map(x=>{let i=state.info.indexOf(x);return `<div class="card"><div class="item-head"><div><span class="badge">${esc(x.level)}</span></div><div class="actions small"><button onclick="openModal('info',${i})">编辑</button><button onclick="copyInfo(${i})">复制</button><button class="danger" onclick="delObj('info',${i})">删除</button></div></div><h3>${esc(x.name)}</h3><p>${esc(x.content)}</p><p class="muted">已知：${esc(x.known||'—')}<br>未知：${esc(x.unknown||'—')}</p></div>`}).join('')}</div></div>`).join(''):'<div class="empty">还没有信息点。</div>'}`}
function copyInfo(i){let x=structuredClone(state.info[i]);x.id=uid('I');x.name+='（副本）';state.info.splice(i+1,0,x);save();render()}

function characters(){return `<div class="toolbar"><button class="primary" onclick="openModal('character')">＋新建人物</button></div><div class="three">${state.characters.map((c,i)=>`<div class="card"><div class="item-head"><span class="badge">${esc(c.type)}</span><div class="actions small"><button onclick="openModal('character',${i})">编辑</button><button onclick="copyChar(${i})">复制</button><button class="danger" onclick="delObj('characters',${i})">删除</button></div></div><h3>${esc(c.name)}</h3><p>${esc(c.personality||'')}</p><p class="muted">目标：${esc(c.goal||'')}<br>状态：${esc(c.status||'')}</p></div>`).join('')}</div>`}function copyChar(i){let c=structuredClone(state.characters[i]);c.id=uid('C');c.name+='（副本）';state.characters.splice(i+1,0,c);save();render()}
function relations(){return `<div class="toolbar"><button class="primary" onclick="openModal('relation')">＋新建关系</button></div>${state.relations.length?`<div class="tablewrap"><table><thead><tr><th>A</th><th>B</th><th>关系</th><th>A怎么看B</th><th>B怎么看A</th><th>实际关系</th><th>信息差</th><th></th></tr></thead><tbody>${state.relations.map((r,i)=>`<tr><td>${esc(r.a)}</td><td>${esc(r.b)}</td><td>${esc(r.type)} / ${esc(r.status)}</td><td>${esc(r.aView)}</td><td>${esc(r.bView)}</td><td>${esc(r.actual)}</td><td>${esc(r.diff)}</td><td class="actions small"><button onclick="openModal('relation',${i})">编辑</button><button onclick="copyRel(${i})">复制</button><button class="danger" onclick="delObj('relations',${i})">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有关系。人物建立后可以自由建立双向关系。</div>'}`}
function copyRel(i){let r=structuredClone(state.relations[i]);r.id=uid('G');state.relations.splice(i+1,0,r);save();render()}
function timeline(){let ev=state.timeline.slice().sort((a,b)=>(+a.chapter||0)- (+b.chapter||0));return `<div class="hint">时间轴只记“发生了什么、在哪一章、它改变了什么”。下面的初始事件只是帮助你理解怎么用，不要求一次填完整本书。</div><div class="toolbar"><button class="primary" onclick="openModal('timeline')">＋新建事件</button></div><div class="card"><div class="timeline">${ev.map((x,i)=>`<div class="event"><div class="item-head"><b>第${esc(x.chapter)}章 · ${esc(x.title)}</b><div class="actions small"><button onclick="openModal('timeline',${i})">编辑</button><button class="danger" onclick="delObj('timeline',${i})">删除</button></div></div><div class="muted">${esc(x.detail)}</div><div class="chips">${arr(x.links).map(y=>`<span class="badge">${esc(y)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">还没有时间轴事件。</div>'}</div></div>`}

function chapter(){return `<div class="toolbar"><button class="primary" onclick="openModal('chapterImport')">＋粘贴正文并分章</button><button onclick="openModal('chapter')">＋新建单章</button></div><div class="hint">章节卡只保留真正需要你判断的东西。正文粘进来后会按章节自动拆开；列表先压缩成小按钮，点开才看具体内容和章节卡。</div>${state.chapters.length?`<div class="chapter-buttons">${state.chapters.map((c,i)=>`<button class="chapter-mini" onclick="openModal('chapterCard',${i})"><b>第${esc(c.num||'?')}章</b><span>${esc(c.title||'未命名')}</span><small>${(c.text||'').length.toLocaleString()}字 · ${arr(c.card?.functions).join('、')||'未设置功能'}</small></button>`).join('')}</div>`:'<div class="empty">还没有章节。点击“粘贴正文并分章”开始。</div>'}`}

function copyChapter(i){let c=structuredClone(state.chapters[i]);c.id=uid('CH');c.num='';c.title+='（副本）';state.chapters.splice(i+1,0,c);save();render()}
function review(){let checks=['这一章有明确的章节功能','这一章有有效推进，而不是只提供信息','人物状态/关系发生了变化','读者能看懂，但不是所有东西都被解释完','章末留下继续读的理由','这一章有我自己真正满意的句子/段落'];return `<div class="hint">复盘不再自动识别。这里只做作者自己的快速判断：每章用 ✓ / × 标一下，几秒钟就够了。</div>${state.chapters.length?state.chapters.map((c,i)=>{let ck=c.checklist||{};return `<div class="card section"><div class="item-head"><div><span class="badge">第${esc(c.num||'?')}章</span> <b>${esc(c.title||'未命名')}</b></div><span class="muted">${(c.text||'').length.toLocaleString()}字</span></div><div class="review-grid">${checks.map((q,j)=>{let v=ck[j];return `<div class="review-row"><span>${q}</span><div class="actions small"><button class="${v===true?'primary':''}" onclick="setCheck(${i},${j},true)">✓</button><button class="${v===false?'danger':''}" onclick="setCheck(${i},${j},false)">×</button></div></div>`}).join('')}</div>${field('一句话备注','rv_note_'+i,c.reviewNote||'',true)}<div class="actions"><button onclick="saveReviewNote(${i})">保存备注</button></div></div>`}).join(''):'<div class="empty">还没有章节。正文进入后，这里会自动出现每章的快速复盘。</div>'}`}
function setCheck(i,j,v){state.chapters[i].checklist=state.chapters[i].checklist||{};state.chapters[i].checklist[j]=v;save();render()}
function saveReviewNote(i){state.chapters[i].reviewNote=g('rv_note_'+i);save();toast('复盘备注已保存');render()}

function copyReview(i){let r=structuredClone(state.reviews[i]);r.id=uid('V');state.reviews.splice(i+1,0,r);save();render()}

function openModal(type,index=null,prefill=''){let html='';let title='';if(type==='card'){let c=index==null?{name:'',type:state.systems.types.card[0],depth:'1',content:'',tags:'',people:'',info:'',chapters:'',uses:0,note:''}:state.cards[index];title=index==null?'新建牌':'编辑牌';html=formCard(c,index)}else if(type==='stage'){let s=index==null?{name:'',goal:'',wordRef:'',tasks:[],done:[]}:state.stages[index];title=index==null?'新建阶段':'编辑阶段';html=formStage(s,index)}else if(type==='info'){let x=index==null?{name:'',type:state.systems.types.info[0],level:state.systems.levels.info[0],content:'',known:'',unknown:''}:state.info[index];title=index==null?'新建信息点':'编辑信息点';html=formInfo(x,index)}else if(type==='character'){let c=index==null?{name:'',type:state.systems.types.character[0],basic:'',personality:'',desire:'',motive:'',secret:'',goal:'',status:'',known:'',unknown:'',misunderstanding:'',arc:'',custom:''}:state.characters[index];title=index==null?'新建人物':'编辑人物';html=formChar(c,index)}else if(type==='relation'){let r=index==null?{a:'',b:'',type:state.systems.types.relation[0],status:'',aView:'',bView:'',actual:'',diff:''}:state.relations[index];title=index==null?'新建关系':'编辑关系';html=formRelation(r,index)}else if(type==='timeline'){let x=index==null?{chapter:'',title:'',detail:'',links:''}:state.timeline[index];title=index==null?'新建时间轴事件':'编辑时间轴事件';html=formTimeline(x,index)}else if(type==='chapterImport'){title='粘贴正文并自动分章';html=`<div class="hint">把一章或整本正文直接粘进来。系统会识别“第X章”标题并拆成多个章节；如果没有章节标题，就按一章保存。不会自动修改牌库、人物或信息地图。</div>${field('文件/批次名称（可选）','imp_title',prefill)}${field('正文','imp_text',prefill,true)}<div class="actions"><button class="primary" onclick="createChaptersFromModal()">分章并保存</button><button onclick="closeModal()">取消</button></div>`}else if(type==='chapter'){let c={num:'',title:'',text:'',status:'写作中',analysis:null,review:null};title='新建章节';html=formChapter(c,null)}else if(type==='viewChapter'){let c=state.chapters[index];title='查看正文';html=`<p><span class="badge">第${esc(c.num)}章</span> <b>${esc(c.title)}</b> · ${(c.text||'').length}字</p><textarea style="min-height:420px">${esc(c.text||'')}</textarea><div class="actions"><button onclick="closeModal()">关闭</button><button class="primary" onclick="analyzeChapter(${index});closeModal()">重新识别</button></div>`}else if(type==='reviewChapter'){let c=state.chapters[index];title='章节复盘';html=`<div class="hint">系统将读取第${esc(c.num)}章正文并生成本地识别结果。</div><div id="reviewPreview">${analysisHtml(c.analysis||analyzeText(c.text||''))}</div><div class="actions"><button class="primary" onclick="acceptAnalysis(${index})">确认并写入</button><button onclick="closeModal()">关闭</button></div>`}else if(type==='chapterCard'){let c=index==null?{num:'',title:'',card:{functions:[],engine:'',resources:[],changes:''}}:state.chapters[index];title='章节卡';html=formChapterCard(c,index)}else if(type==='review'){let r=index==null?{chapter:'',title:'',summary:'',detected:[],changes:'',notes:''}:state.reviews[index];title=index==null?'新建复盘':'编辑复盘';html=formReview(r,index)}else if(type==='progress'){title='编辑系统状态';html=`<div class="formgrid">${field('当前阶段','p_stage',state.progress.currentStage)}${field('当前信息层级','p_info',state.progress.infoLevel)}${field('当前感情阶段','p_love',state.progress.loveStage)}${field('当前连载状态','p_serial',state.progress.serialStatus)}${field('当前存稿','p_stock',state.progress.stock)}</div><div class="actions"><button class="primary" onclick="saveProgress()">保存</button></div>`}else if(type==='system'){let [kind,key]=String(index).split(':');let list=state.systems[kind==='type'?'types':'levels'][key]||[];title='编辑选项库：'+key;html=`<p class="muted">每行一个选项。修改后会影响对应下拉/多选。</p><textarea id="sysList" style="min-height:240px">${esc(list.join('\n'))}</textarea><div class="actions"><button class="primary" onclick="saveSystem('${kind}','${key}')">保存</button></div>`}document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button onclick="closeModal()">×</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}function g(id){return document.getElementById(id)?.value||''}function saveProgress(){Object.assign(state.progress,{currentStage:g('p_stage'),infoLevel:g('p_info'),loveStage:g('p_love'),serialStatus:g('p_serial'),stock:+g('p_stock')||0});save();closeModal();render()}

function formRelation(r,i){let names=state.characters.map(x=>x.name).filter(Boolean);return `<div class="formgrid"><div class="field"><label>A</label><select id="r_a">${opts(names,r.a)}</select></div><div class="field"><label>B</label><select id="r_b">${opts(names,r.b)}</select></div><div class="field"><label>关系类型</label><select id="r_type">${opts(state.systems.types.relation,r.type)}<option value="__new">＋新建类型</option></select></div>${field('当前关系状态','r_status',r.status)}</div>${field('A怎么看B','r_aview',r.aView,true)}${field('B怎么看A','r_bview',r.bView,true)}${field('A以为B怎么看自己','r_ami',r.aMis,true)}${field('B以为A怎么看自己','r_bmi',r.bMis,true)}${field('实际关系','r_actual',r.actual,true)}${field('信息差','r_diff',r.diff,true)}<div class="actions"><button class="primary" onclick="saveRelation(${i==null?'null':i})">保存</button></div>`}function saveRelation(i){let type=g('r_type');if(type==='__new'){let n=prompt('新关系类型');if(!n)return;state.systems.types.relation.push(n);type=n}let r={id:i==null?uid('G'):state.relations[i].id,a:g('r_a'),b:g('r_b'),type,status:g('r_status'),aView:g('r_aview'),bView:g('r_bview'),aMis:g('r_ami'),bMis:g('r_bmi'),actual:g('r_actual'),diff:g('r_diff')};if(i==null)state.relations.push(r);else state.relations[i]=r;save();closeModal();render()}
function formTimeline(x,i){return `${field('章节','t_ch',x.chapter)}${field('事件标题','t_title',x.title)}${field('详情','t_detail',x.detail,true)}${field('关联对象（逗号分隔）','t_links',x.links)}<div class="actions"><button class="primary" onclick="saveTimeline(${i==null?'null':i})">保存</button></div>`}function saveTimeline(i){let x={id:i==null?uid('T'):state.timeline[i].id,chapter:g('t_ch'),title:g('t_title'),detail:g('t_detail'),links:g('t_links')};if(i==null)state.timeline.push(x);else state.timeline[i]=x;save();closeModal();render()}
function formChapter(c,i){return `${field('章节号','cc_num',c.num)}${field('标题','cc_title',c.title)}<div class="field"><label>正文</label><textarea id="cc_text" style="min-height:350px">${esc(c.text||'')}</textarea></div><div class="field"><label>状态</label><select id="cc_status">${opts(state.systems.levels.status,c.status)}</select></div><div class="actions"><button class="primary" onclick="saveChapter(${i==null?'null':i})">保存</button></div>`}function saveChapter(i){let c={id:i==null?uid('CH'):state.chapters[i].id,num:g('cc_num'),title:g('cc_title'),text:g('cc_text'),status:g('cc_status'),analysis:null,review:null,card:i==null?{functions:[],engine:'',resources:[],changes:''}:state.chapters[i].card,checklist:i==null?{}:state.chapters[i].checklist||{},reviewNote:i==null?'':state.chapters[i].reviewNote||''};if(i==null)state.chapters.push(c);else state.chapters[i]=c;recalc();save();closeModal();render()}
function formChapterCard(c,i){let card=c.card||{functions:[],engine:'',resources:[],changes:''};let engines=['事件','任务','人物欲望','感情关系','内在动机','信息差','突发事件','混合'];let resources=[...state.characters.map(x=>x.name),...state.cards.map(x=>x.name),...state.info.map(x=>x.name)].filter(Boolean);return `<div class="card section" style="background:#f7f5f1"><b>第${esc(c.num||'?')}章 · ${esc(c.title||'未命名')}</b><div class="muted" style="white-space:pre-wrap;max-height:240px;overflow:auto;margin-top:8px">${esc(c.text||'还没有正文。')}</div></div><div class="field"><label>本章功能（多选）</label><div class="checks">${state.systems.types.function.map(x=>`<label class="check"><input type="checkbox" name="cf" value="${esc(x)}" ${card.functions.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div></div><div class="field"><label>剧情发动机</label><div class="checks">${engines.map(x=>`<label class="check"><input type="radio" name="ce" value="${x}" ${card.engine===x?'checked':''}>${x}</label>`).join('')}</div></div><div class="field"><label>使用资源（多选）</label><div class="checks">${resources.map(x=>`<label class="check"><input type="checkbox" name="cr" value="${esc(x)}" ${arr(card.resources).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div></div>${field('状态变化','cchange',card.changes,true)}<div class="actions"><button class="primary" onclick="saveChapterCard(${i==null?'null':i})">保存</button></div>`}function saveChapterCard(i){let c=state.chapters[i];if(!c)return;let funcs=[...document.querySelectorAll('input[name="cf"]:checked')].map(x=>x.value),engine=document.querySelector('input[name="ce"]:checked')?.value||'',res=[...document.querySelectorAll('input[name="cr"]:checked')].map(x=>x.value);c.card={functions:funcs,engine,resources:res,changes:g('cchange')};save();closeModal();render()}
function formReview(r,i){return `${field('章节','rv_ch',r.chapter)}${field('标题','rv_title',r.title)}${field('总结','rv_sum',r.summary,true)}${field('识别到的资源','rv_detect',arr(r.detected).join(', '),true)}${field('数据变化','rv_changes',r.changes,true)}${field('备注','rv_notes',r.notes,true)}<div class="actions"><button class="primary" onclick="saveReview(${i==null?'null':i})">保存</button></div>`}function saveReview(i){let r={id:i==null?uid('V'):state.reviews[i].id,chapter:g('rv_ch'),title:g('rv_title'),summary:g('rv_sum'),detected:arr(g('rv_detect')),changes:g('rv_changes'),notes:g('rv_notes')};if(i==null)state.reviews.push(r);else state.reviews[i]=r;save();closeModal();render()}
function analyzeText(text){let lower=text.toLowerCase();let chars=state.characters.filter(c=>c.name&&text.includes(c.name)).map(c=>c.name);let cards=state.cards.filter(c=>c.name&&text.includes(c.name)).map(c=>c.name);let infos=state.info.filter(x=>x.name&&text.includes(x.name)).map(x=>x.name);let scenes=state.cards.filter(c=>c.type.includes('场景')&&c.name&&text.includes(c.name)).map(c=>c.name);let relations=state.relations.filter(r=>(r.a&&text.includes(r.a))||(r.b&&text.includes(r.b))).map(r=>r.a+'↔'+r.b);let functions=[];if(/喜欢|心动|暧昧|亲近|吃醋|抱|牵|吻|想他|想她/.test(text))functions.push('感情推进');if(/发现|终于|原来|秘密|真相|知道|怀疑|身份/.test(text))functions.push('信息释放');if(/争执|冲突|吵|危险|救援|失踪|袭击/.test(text))functions.push('冲突');if(/第一次|再次|后来|多年后|从此/.test(text))functions.push('人物塑造');return {words:text.length,characters:chars,cards,info:infos,scenes,relations,functions,detected:[...new Set([...chars,...cards,...infos,...scenes])]}}
function analysisHtml(a){return `<div class="section three"><div class="card"><b>人物</b><p>${a.characters.join('、')||'未匹配'}</p></div><div class="card"><b>牌</b><p>${a.cards.join('、')||'未匹配'}</p></div><div class="card"><b>信息</b><p>${a.info.join('、')||'未匹配'}</p></div></div><div class="card section"><b>剧情功能</b><p>${a.functions.join('、')||'未匹配'}</p><b>关系</b><p>${a.relations.join('、')||'未匹配'}</p><p class="muted">共 ${a.words} 字。</p></div>`}
function analyzeChapter(i){let c=state.chapters[i];if(!c)return;let a=analyzeText(c.text||'');c.analysis=a;c.card=c.card||{functions:a.functions,engine:'',resources:a.detected,changes:''};c.card.functions=[...new Set([...(c.card.functions||[]),...a.functions])];c.card.resources=[...new Set([...(c.card.resources||[]),...a.detected])];a.cards.forEach(n=>{let x=state.cards.find(x=>x.name===n);if(x){x.uses=(x.uses||0)+1;x.chapters=Array.from(new Set([...arr(x.chapters),c.num])).join(',')}});state.recent=state.recent||[];state.recent.push({title:'正文识别',text:`第${c.num}章匹配 ${a.detected.length} 个已有对象`});state.recent=state.recent.slice(-20);save();render()}

function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.novel||!x.cards)throw Error('不是小说控制台 JSON');state=x;save();render();toast('导入成功')}catch(err){alert('导入失败：'+err.message)}};r.readAsText(f)}function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小说控制台-V2-备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function recalc(){state.serial=state.serial||{settings:{},days:[],published:[]};state.serial.settings=Object.assign({freq:'每日',targetChapters:1,targetWords:2000,time:'',safety:5},state.serial.settings||{});state.serial.published=state.serial.published||[];state.progress.totalWords=state.chapters.reduce((n,c)=>n+(c.text||'').length,0);state.progress.currentChapter=state.chapters[state.chapters.length-1]?.num||'';state.progress.stock=state.chapters.filter(c=>c.status==='已完成'&&!c.published).length;state.progress.percent=state.progress.totalWords?Math.min(100,Math.round(state.progress.totalWords/300000*100)):0}function resourceStatus(c){let d=+c.depth||1;return d<=1?'当前可调用':d<=2?'建议谨慎':'尚未开放'}
