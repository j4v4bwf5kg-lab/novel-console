<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小说控制台 V2.1｜心跳预判</title>
<style>
:root{--bg:#f5f2ee;--panel:#fff;--text:#292724;--muted:#77716a;--line:#e7e0d8;--dark:#292724;--soft:#f0ebe5;--pink:#d9a9a9;--green:#9bb59e;--blue:#a9b9d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px}button:hover{background:#f3eee8}
.app{display:flex;min-height:100vh}.side{width:230px;background:var(--dark);color:#eee9df;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-weight:700;font-size:19px;margin:0 8px 4px}.sub{font-size:11px;color:#aaa49a;margin:0 8px 22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cfc8bd;border:0;margin:3px 0}.nav button.active,.nav button:hover{background:#403b34;color:#fff}.main{flex:1;padding:28px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px #00000008}.metric small{color:var(--muted)}.metric b{display:block;font-size:25px;margin:5px 0}.metric span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#ebe5de;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--dark)}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge,.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;background:var(--soft);font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,input,textarea,select{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.toolbar input{flex:1;min-width:180px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button.sel,.primary{background:var(--dark);color:#fff}.todo{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.todo:last-child{border-bottom:0}.todo.done span{text-decoration:line-through;color:#999}.cardlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.chapter-card{cursor:pointer}.chapter-card:hover{transform:translateY(-1px)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.empty{padding:35px;text-align:center;color:#8a837b}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid>*{min-width:0}textarea{width:100%;min-height:140px;resize:vertical}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:91px;top:0;bottom:0;width:2px;background:#ded7cf}.event{position:relative;display:grid;grid-template-columns:75px 34px 1fr;margin:13px 0}.date{text-align:right;padding-top:9px;font-size:11px;color:#837b73}.dot{width:12px;height:12px;background:var(--dark);border-radius:50%;margin:10px auto;z-index:2;box-shadow:0 0 0 5px var(--bg)}.eventbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.eventbox h3{margin:0 0 5px;font-size:15px}.house{min-height:520px;background:linear-gradient(#eee5dc 0 66%,#d9c5ae 66%);border-radius:24px;position:relative;overflow:hidden;border:1px solid #dfd2c5}.window{position:absolute;right:40px;top:35px;width:120px;height:110px;background:#dce7ee;border:9px solid #b99f86;border-radius:12px}.rug{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:310px;height:105px;border-radius:50%;background:#d8c5bd}.sofa{position:absolute;left:42px;bottom:82px;width:190px;height:75px;border-radius:20px 20px 10px 10px;background:#9eaaa0}.table{position:absolute;right:85px;bottom:90px;width:105px;height:55px;border-radius:14px;background:#9b795d}.plant{position:absolute;left:245px;bottom:92px;font-size:48px}.char{position:absolute;bottom:145px;text-align:center;transition:.25s}.char .body{width:74px;height:90px;border-radius:34px 34px 24px 24px;margin:auto;position:relative}.char .head{width:54px;height:54px;border-radius:50%;background:#f2cdb9;margin:auto;position:relative;z-index:2;border:3px solid #2f2c29}.char .label{font-size:12px;margin-top:4px;font-weight:700}.mocha{left:18%;}.mocha .body{background:#272a2b}.jiang{left:58%}.jiang .body{background:#eee;border:1px solid #ddd}.face{position:absolute;left:15px;top:20px;width:5px;height:5px;border-radius:50%;background:#292724;box-shadow:20px 0 #292724}.food{position:absolute;left:50%;top:25px;transform:translateX(-50%);background:#fff8e9;padding:10px 14px;border-radius:12px;border:1px solid #e6d8bd;display:none}.house.normal .food{display:none}.house.warm .mocha{left:33%}.house.warm .jiang{left:48%}.house.argue .mocha{left:8%}.house.argue .jiang{left:72%}.house.cold .mocha{left:18%;transform:scaleX(-1)}.house.cold .jiang{left:62%;transform:scaleX(-1)}.house.makeup .mocha{left:36%}.house.makeup .jiang{left:51%}.house.sad .mocha{opacity:.65;bottom:125px}.house.sad .jiang{opacity:.65;bottom:125px}.shop{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.shop button{background:#fffaf4}.points{font-size:26px;font-weight:800}.mini{font-size:11px;color:var(--muted)}footer{margin:28px 0;color:#999;font-size:11px}
@media(max-width:900px){.side{width:72px;padding:15px 8px}.logo,.sub{display:none}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.main{padding:18px}.two,.formgrid{grid-template-columns:1fr}.timeline:before{left:57px}.event{grid-template-columns:43px 28px 1fr}.date{font-size:9px}}
.errorPanel{padding:40px;max-width:760px;margin:40px auto;border:1px solid #e5d6d6;border-radius:18px;background:#fffafa}.errorPanel h1{margin:0 0 12px}.errorPanel p{color:#a33;word-break:break-word}.errorActions{display:flex;gap:10px;margin-top:20px}.errorActions button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="logo">小说控制台</div><div class="sub">V2.1 · 作者负责创作，工具负责整理</div>
<div class="nav">
<button data-page="dashboard">⌂ 总控台</button>
<button data-page="text">▤ 正文库</button>
<button data-page="serial">◷ 连载中心</button>
<button data-page="todo">☑ 阶段 Todo</button>
<button data-page="cards">▣ 牌库</button>
<button data-page="characters">♧ 人物</button>
<button data-page="relations">♡ 人物关系</button>
<button data-page="timeline">⌁ 时间轴</button>
<button data-page="chapter">✎ 章节卡</button>
<button data-page="review">↻ 章节复盘</button>
<button data-page="house">⌂ 故事小屋</button>
<button data-page="custom">⚙ 自定义体系</button>
<button data-page="data">⇅ 数据管理</button>
</div>
</aside>
<main class="main" id="main"></main>
</div>

<script>
const KEY="novel_console_v21_full";
const seed={
page:"dashboard",title:"心跳预判：搜救队长被我训成忠犬。",author:"",backupTitle:"",oldTitle:"",
intro:"",tags:"言情,搜救,感情线",
dailyGoalWords:4000,dailyGoalChapters:2,todayWords:0,todayChapters:0,
stage:0,emotion:"初遇",
chapters:[],cards:[
{name:"兔子徽章",type:"道具",level:1,desc:"与过去相关的重要道具。",tags:"伏笔,道具",people:"荼沫,姜辞与",usage:0}
],characters:[
{name:"荼沫",type:"主角",outfit:"黑色搜救/行动装",mood:"普通"},
{name:"姜辞与",type:"主角",outfit:"白大褂",mood:"普通"}
],relations:[{a:"荼沫",b:"姜辞与",state:"普通",stage:"初遇",note:"关系刚建立"}],
todos:{},events:[],housePoints:0,houseFood:0,houseOutfits:{},houseAccessories:{}
};
function normalizeState(raw){const base=JSON.parse(JSON.stringify(seed));if(!raw||typeof raw!=="object")return base;const out={...base,...raw};for(const k of ["chapters","cards","characters","relations","events"]){if(!Array.isArray(raw[k]))out[k]=base[k]}if(!raw.todos||typeof raw.todos!=="object"||Array.isArray(raw.todos))out.todos=base.todos;if(!raw.houseOutfits||typeof raw.houseOutfits!=="object")out.houseOutfits=base.houseOutfits;if(!raw.houseAccessories||typeof raw.houseAccessories!=="object")out.houseAccessories=base.houseAccessories;return out}
let state=normalizeState(JSON.parse(localStorage.getItem(KEY)||"null"));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function words(){return state.chapters.reduce((n,c)=>n+(c.words||c.text?.replace(/\s/g,"").length||0),0)}
function nav(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function go(p){state.page=p;save();render()}
function render(){try{nav();const m=document.getElementById("main");const names={
dashboard:["总控台","先看这本书现在发生了什么。"],
text:["正文库","正文是核心数据源：写进去，系统再整理。"],
serial:["连载中心","今日写作就是今日更新；正文进入库，就进入更新记录。"],
todo:["阶段 Todo","用标签快速确认当前阶段需要什么。"],
cards:["牌库","小卡片式管理创作资源与信息权限。"],
characters:["人物","人物资料来自已有数据，不要求重复填写。"],
relations:["人物关系","关系状态直接影响故事小屋中的角色状态。"],
timeline:["时间轴","从已有数据重新组织故事发展，不再维护另一张表。"],
chapter:["章节卡","一章一张卡，写前快速确定发动机与变化。"],
review:["章节复盘","只做快速确认，不假装替作者分析小说。"],
house:["故事小屋","小说写得越多，小屋越活。"],
custom:["自定义体系","保留默认选项，也允许自己增加。"],
data:["数据管理","小说数据可以随时导出和恢复。"]};
let [t,d]=names[state.page]||names.dashboard;
m.innerHTML=`<div class="top"><div><h1>${t}</h1><div class="muted">${d}</div></div><div class="actions"><button onclick="exportData()">导出 JSON</button></div></div>${pageContent(state.page)}<footer>数据保存在当前浏览器 localStorage。建议定期导出备份。</footer>`}catch(err){const m=document.getElementById("main");if(m)m.innerHTML=`<div class="errorPanel"><h1>故事控制台启动失败</h1><p>错误：${esc(err&&err.message?err.message:String(err))}</p><div class="errorActions"><button onclick="location.reload()">重新加载</button><button onclick="if(confirm('确定重置本地数据吗？这会清除当前控制台保存的数据。')){localStorage.removeItem(KEY);location.reload()}">重置本地数据</button></div></div>`;console.error(err)}}
function pageContent(p){return ({dashboard:dashboard,text:text,serial:serial,todo:todo,cards:cards,characters:characters,relations:relations,timeline:timeline,chapter:chapter,review:review,house:house,custom:custom,data:data}[p]||dashboard)()}
function dashboard(){let w=words(),pct=state.dailyGoalWords?Math.min(100,state.todayWords/state.dailyGoalWords*100):0;return `<div class="grid">
<div class="card metric"><small>小说名称</small><b style="font-size:18px">${esc(state.title)}</b><span>${esc(state.tags)}</span></div>
<div class="card metric"><small>总字数</small><b>${w.toLocaleString()}</b><span>当前章节 ${state.chapters.length}</span></div>
<div class="card metric"><small>今日更新</small><b>${state.todayChapters}章</b><span>${state.todayWords.toLocaleString()}字</span></div>
<div class="card metric"><small>当前阶段</small><b>${state.stage+1}</b><span>${esc(["让读者想继续","喜欢他们在一起","真正认识彼此","过去进入爱情","角色反转","真相进入关系","真正的爱"][state.stage])}</span></div>
</div>
<div class="section two"><div class="card"><h2>今日目标</h2><p><b>${state.todayChapters}/${state.dailyGoalChapters}章</b> · <b>${state.todayWords.toLocaleString()}/${state.dailyGoalWords.toLocaleString()}字</b></p><div class="progress"><i style="width:${pct}%"></i></div></div>
<div class="card"><h2>当前感情阶段</h2><p class="points">${esc(state.emotion)}</p><div class="muted">人物关系会自动影响故事小屋。</div></div></div>
<div class="section card"><h2>快捷入口</h2><div class="toolbar"><button onclick="go('text')">写入正文</button><button onclick="go('serial')">今日更新</button><button onclick="go('house')">进入故事小屋</button><button onclick="go('timeline')">看时间轴</button></div></div>`}
function text(){return `<div class="card"><h2>粘贴/导入正文</h2><p class="muted">支持一次粘贴整本正文；识别“第一章 / 第1章”自动拆分。</p><textarea id="manuscript" placeholder="把正文粘贴到这里……"></textarea><div class="toolbar" style="margin-top:10px"><button class="primary" onclick="splitText()">自动拆分章节</button><button onclick="clearText()">清空输入框</button></div></div><div class="section card"><h2>章节</h2>${state.chapters.length?state.chapters.map((c,i)=>`<div class="chapter-card card" style="margin:8px 0" onclick="openChapter(${i})"><b>第${i+1}章｜${esc(c.title||"未命名")}</b><span class="muted">　${(c.words||0).toLocaleString()}字</span></div>`).join(""):"<div class='empty'>还没有正文。写进去就从这里开始。</div>"}</div>`}
function splitText(){const t=document.getElementById("manuscript").value.trim();if(!t)return;const parts=t.split(/(?=第\s*[0-9一二三四五六七八九十百千万]+章)/g).filter(x=>x.trim());state.chapters=parts.map((x,i)=>{let ls=x.trim().split("\n"),title=ls[0].trim();return {title:title||`第${i+1}章`,text:x.trim(),words:x.replace(/\s/g,"").length}});state.todayChapters=state.chapters.length;state.todayWords=state.chapters.reduce((a,c)=>a+c.words,0);state.housePoints+=Math.floor(state.todayWords/100);save();render()}
function clearText(){const x=document.getElementById("manuscript");if(x)x.value=""}
function openChapter(i){alert("第"+(i+1)+"章｜"+state.chapters[i].title+"\\n\\n"+state.chapters[i].text.slice(0,800)+(state.chapters[i].text.length>800?"\\n……":""))}
function serial(){let pct=state.dailyGoalWords?Math.min(100,state.todayWords/state.dailyGoalWords*100):0;return `<div class="grid"><div class="card metric"><small>今日更新</small><b>${state.todayChapters}章 / ${state.todayWords.toLocaleString()}字</b></div><div class="card metric"><small>当前存稿</small><b>${state.chapters.length}章 / ${words().toLocaleString()}字</b></div></div><div class="section card"><h2>每日目标</h2><div class="formgrid"><label>目标章节数<input id="goalCh" type="number" value="${state.dailyGoalChapters}" onchange="updateGoal()"></label><label>目标字数<input id="goalW" type="number" value="${state.dailyGoalWords}" onchange="updateGoal()"></label></div><p>${state.todayChapters}/${state.dailyGoalChapters}章 · ${state.todayWords.toLocaleString()}/${state.dailyGoalWords.toLocaleString()}字</p><div class="progress"><i style="width:${pct}%"></i></div></div>`}
function updateGoal(){state.dailyGoalChapters=+document.getElementById("goalCh").value||1;state.dailyGoalWords=+document.getElementById("goalW").value||4000;save();render()}
const stageNames=["让读者想继续","喜欢他们在一起","真正认识彼此","过去进入爱情","角色反转","真相进入关系","真正的爱"];
function todo(){const tags=["推进主线","人物塑造","关系推进","埋伏笔","回收伏笔","荼沫","姜辞与","兔子徽章"];return `<div class="tabs">${stageNames.map((x,i)=>`<button class="${i===state.stage?'sel':''}" onclick="state.stage=${i};save();render()">${i+1}. ${x}</button>`).join("")}</div><div class="card"><h2>${stageNames[state.stage]}</h2><div class="badges">${tags.map((x,i)=>{let k=state.stage+"-"+i,d=!!state.todos[k];return `<button class="${d?'primary':''}" onclick="state.todos['${k}']=!state.todos['${k}'];save();render()">[${x}]</button>`}).join("")}</div></div>`}
function cards(){return `<div class="toolbar"><input id="cs" placeholder="搜索牌名/类型" oninput="filterCards()"><button onclick="addCard()">＋新建</button></div><div class="cardlist" id="cardlist">${state.cards.map((c,i)=>`<div class="card"><h3>${esc(c.name)}</h3><div class="badges"><span class="badge">${esc(c.type)}</span><span class="badge">深度 ${c.level}/5</span></div><p>${esc(c.desc)}</p><p class="muted">标签：${esc(c.tags)} · 使用 ${c.usage||0} 次</p><p class="muted">关联：${esc(c.people)}</p></div>`).join("")}</div>`}
function filterCards(){let q=(document.getElementById("cs").value||"").toLowerCase();document.querySelectorAll("#cardlist .card").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none")}
function addCard(){let n=prompt("牌名");if(!n)return;state.cards.push({name:n,type:"其他",level:1,desc:"",tags:"",people:"",usage:0});save();render()}
function characters(){return `<div class="cardlist">${state.characters.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><div class="badges"><span class="badge">${esc(c.type)}</span><span class="badge">${esc(c.outfit)}</span></div><p>当前状态：${esc(c.mood)}</p></div>`).join("")}</div>`}
function relations(){return `<div class="cardlist">${state.relations.map((r,i)=>`<div class="card"><h2>${esc(r.a)} × ${esc(r.b)}</h2><div class="badges"><button onclick="cycleRel(${i})">${esc(r.state)}</button><span class="badge">${esc(r.stage)}</span></div><p>${esc(r.note)}</p></div>`).join("")}</div><p class="muted">关系状态会同步到故事小屋。</p>`}
function cycleRel(i){let arr=["普通","升温","吵架","冷战","和好","难过"],x=arr.indexOf(state.relations[i].state);state.relations[i].state=arr[(x+1)%arr.length];state.emotion=state.relations[i].state;save();render()}
function timeline(){let ev=[...state.events];state.chapters.forEach((c,i)=>ev.push({chapter:i+1,type:"剧情",title:c.title,text:"正文已写入",tags:["正文"]}));if(!ev.length)return `<div class="empty card">还没有足够数据生成时间轴。写正文或章节卡后，它会自己长出来。</div>`;return `<div class="toolbar">${["全部","剧情","感情","人物","伏笔","信息"].map(t=>`<button onclick="filterTimeline('${t}')">${t}</button>`).join("")}</div><div class="timeline" id="timeline">${ev.map(e=>`<div class="event" data-type="${esc(e.type||"剧情")}"><div class="date">第${e.chapter||"—"}章</div><div class="dot"></div><div class="eventbox"><h3>${esc(e.title)}</h3><p class="muted">${esc(e.text||"")}</p><div class="badges">${(e.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div></div>`).join("")}</div>`}
function filterTimeline(t){document.querySelectorAll("#timeline .event").forEach(e=>e.style.display=(t==="全部"||e.dataset.type===t)?"":"none")}
function chapter(){return `<div class="card"><h2>新建章节卡</h2><div class="formgrid"><label>章节<input id="cn" placeholder="第1章"></label><label>标题<input id="ct" placeholder="章节标题"></label><label>发动机<input id="ce" placeholder="任务/场景/人物欲望"></label><label>资源<input id="cr" placeholder="可调用的牌、人物、场景"></label></div><label>这一章要改变什么<textarea id="cc"></textarea></label><button class="primary" onclick="addChapterCard()">保存章节卡</button></div><div class="section cardlist">${state.events.filter(x=>x.source==="chapter").map(e=>`<div class="card"><b>${esc(e.title)}</b><p>${esc(e.text)}</p></div>`).join("")}</div>`}
function addChapterCard(){let title=document.getElementById("ct").value||"未命名章节",text=document.getElementById("cc").value;state.events.push({chapter:document.getElementById("cn").value,type:"剧情",title,text,tags:[document.getElementById("ce").value,document.getElementById("cr").value],source:"chapter"});save();render()}
function review(){let qs=["本章是否推进主线？","人物是否发生变化？","信息释放是否符合当前深度？","关系是否发生可感知变化？","是否埋下或回收伏笔？","章末是否产生新的阅读问题？"];return `<div class="card">${qs.map((q,i)=>`<label class="todo"><input type="checkbox" onchange="this.nextElementSibling.style.textDecoration=this.checked?'line-through':''"><span>${q}</span></label>`).join("")}</div>`}
function house(){let rel=state.relations[0]?.state||"普通",cls={普通:"normal",升温:"warm",吵架:"argue",冷战:"cold",和好:"makeup",难过:"sad"}[rel]||"normal";return `<div class="card"><div class="grid"><div><div class="mini">写作积分</div><div class="points">${state.housePoints}</div></div><div><div class="mini">当前关系</div><div class="points" style="font-size:20px">${esc(rel)}</div></div><div><div class="mini">小屋食物</div><div class="points" style="font-size:20px">${state.houseFood}</div></div></div></div><div class="section house ${cls}"><div class="window"></div><div class="rug"></div><div class="sofa"></div><div class="table"></div><div class="plant">🪴</div><div class="food">🍰 谢谢你今天写了这么多！</div><div class="char mocha"><div class="head"><div class="face"></div></div><div class="body"></div><div class="label">荼沫</div></div><div class="char jiang"><div class="head"><div class="face"></div></div><div class="body"></div><div class="label">姜辞与</div></div></div><div class="section card"><h2>今天给他们买点东西</h2><div class="shop"><button onclick="buyFood('🍰')">🍰 蛋糕 · 10分</button><button onclick="buyFood('☕')">☕ 热饮 · 10分</button><button onclick="buyFood('🍪')">🍪 点心 · 20分</button></div><p class="muted">1000字自动获得10积分。积分来自正文库的字数。</p></div>`}
function buyFood(x){if(state.housePoints<10){alert("积分还不够，先写一点吧。");return}state.housePoints-=10;state.houseFood++;save();render()}
function custom(){return `<div class="card"><h2>默认体系</h2><div class="badges">${["感情","人物","道具","事件","信息","伏笔","场景","其他"].map(x=>`<span class="tag">${x}</span>`).join("")}</div><p class="muted">第一版先保持轻量；以后可继续新增、编辑、排序。</p></div>`}
function data(){return `<div class="card"><h2>数据安全</h2><p>小说数据可以随时导出。代码可以重做，但小说数据不能丢。</p><div class="toolbar"><button class="primary" onclick="exportData()">导出全部 JSON</button><button onclick="document.getElementById('imp').click()">导入 JSON</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="小说控制台-V2.1-备份.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=normalizeState(JSON.parse(r.result));save();render()}catch{alert("JSON 无法读取")}};r.readAsText(f)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
render();
</script>
</body>
</html>
